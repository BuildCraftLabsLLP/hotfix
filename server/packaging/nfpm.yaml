# .deb / .rpm for Hotfix Server (built by server/packaging/release.sh with
# nfpm, https://nfpm.goreleaser.com). Run from the repo root with the binary
# copied to dist/nfpm-server/hotfixd (nfpm doesn't expand variables in paths):
#
#   ARCH=amd64 VERSION=1.0.0 nfpm package -f server/packaging/nfpm.yaml -p deb -t out.deb
#
# Installs /usr/bin/hotfixd and its systemd unit, enables and starts the
# service on first install (in monitor mode: it only reports), restarts it on
# upgrade, and stops it and releases the license seat on removal.
name: hotfix-server
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: BuildCraft Labs <buildcraftlabsllp@gmail.com>
vendor: BuildCraft Labs
homepage: https://hotfix.buildcraft.town/server.html
license: Elastic-2.0
description: |-
  Kills runaway processes before they take a server down.
  Hotfix Server watches every process's CPU use and kills (or, in monitor
  mode, reports) processes that stay above a threshold for too long.

contents:
  - src: dist/nfpm-server/hotfixd
    dst: /usr/bin/hotfixd
    file_info:
      mode: 0755
  - src: server/packaging/hotfixd.service
    dst: /usr/lib/systemd/system/hotfixd.service
    file_info:
      mode: 0644
  - src: server/packaging/config.json
    dst: /etc/hotfix-server/config.json
    type: config|noreplace
    file_info:
      mode: 0644
  - src: server/LICENSE
    dst: /usr/share/doc/hotfix-server/LICENSE
    file_info:
      mode: 0644

scripts:
  postinstall: server/packaging/postinstall.sh
  preremove: server/packaging/preremove.sh
  postremove: server/packaging/postremove.sh
