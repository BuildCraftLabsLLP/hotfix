# .deb / .rpm package for Hotfix — the Linux counterpart of the Windows
# Setup.exe: double-click to install (Ubuntu's App Center, GNOME Software, …).
# Installs system-wide: /usr/bin/hotfix plus an app-menu entry and icon.
#
# Built by CI with nfpm (https://nfpm.goreleaser.com). Run from the repo root,
# with the binary to package copied to dist/nfpm/hotfix first (nfpm doesn't
# expand variables in file paths, so the source path is fixed):
#
#   install -D -m 755 dist/linux-x86_64/hotfix dist/nfpm/hotfix
#   ARCH=amd64 VERSION=1.0.12 nfpm package -f linux/packaging/nfpm.yaml -p deb -t dist/hotfix.deb
#
# ARCH is a Go architecture (amd64, arm64); nfpm maps it to each format's name.
# A pre-release VERSION such as 1.0.12-dev becomes 1.0.12~dev, which sorts
# before 1.0.12.
name: hotfix
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: BuildCraft Labs <buildcraftlabsllp@gmail.com>
vendor: BuildCraft Labs
homepage: https://github.com/BuildCraftLabsLLP/hotfix
license: MIT
description: |-
  Kills runaway processes before your fans spin up.
  Hotfix sits in the system tray, watches CPU usage, and terminates any
  process that stays above a threshold for too long.

# Optional extras: the GNOME tray-icon extension (Ubuntu ships it already) and
# xdotool, which lets "Protect Active App" find the focused window on X11.
suggests:
  - gnome-shell-extension-appindicator
  - xdotool

contents:
  - src: dist/nfpm/hotfix
    dst: /usr/bin/hotfix
    file_info:
      mode: 0755
  - src: linux/packaging/hotfix.desktop
    dst: /usr/share/applications/hotfix.desktop
    file_info:
      mode: 0644
  - src: icon/AppIcon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/hotfix.svg
    file_info:
      mode: 0644
