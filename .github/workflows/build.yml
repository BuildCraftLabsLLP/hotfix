name: Build

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache-dependency-path: windows/go.sum

      - name: Tidy and download dependencies
        run: |
          cd windows
          go mod tidy
          go mod download

      - name: Test
        run: |
          cd windows
          go test ./...

      # Stamp the version (from the release tag) into versioninfo.json, then
      # generate resource.syso so the built .exe carries the flame icon and
      # correct version metadata. On non-release runs the JSON default is used.
      - name: Generate version resource (icon + metadata)
        run: |
          cd windows
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag) {
            $ver = $tag.TrimStart('v')
            $p = $ver.Split('.')
            $j = Get-Content versioninfo.json -Raw | ConvertFrom-Json
            $j.FixedFileInfo.FileVersion.Major    = [int]$p[0]
            $j.FixedFileInfo.FileVersion.Minor    = [int]$p[1]
            $j.FixedFileInfo.FileVersion.Patch    = [int]$p[2]
            $j.FixedFileInfo.ProductVersion.Major = [int]$p[0]
            $j.FixedFileInfo.ProductVersion.Minor = [int]$p[1]
            $j.FixedFileInfo.ProductVersion.Patch = [int]$p[2]
            $j.StringFileInfo.FileVersion    = $ver
            $j.StringFileInfo.ProductVersion = $ver
            $j | ConvertTo-Json -Depth 10 | Set-Content versioninfo.json -Encoding utf8
          }
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          & "$(go env GOPATH)\bin\goversioninfo.exe" -64 -o resource.syso versioninfo.json

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          cd windows
          New-Item -ItemType Directory -Force -Path ..\dist | Out-Null
          go build -ldflags "-H windowsgui -s -w" -o ..\dist\Hotfix.exe .

      # Build the per-user installer (Hotfix-Setup...exe). Installs to
      # %LOCALAPPDATA%\Programs\Hotfix without admin, so silent updates work.
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          $tag = "${{ github.event.release.tag_name }}"
          if ($tag) { $ver = $tag.TrimStart('v'); $name = "Hotfix-Setup-$tag-Windows" }
          else      { $ver = "0.0.0";            $name = "Hotfix-Setup" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" "/DMyAppSetupName=$name" `
            windows\installer\hotfix.iss

      - name: Upload artifact (all runs)
        uses: actions/upload-artifact@v7
        with:
          name: Hotfix-Windows
          path: |
            dist/Hotfix.exe
            dist/Hotfix-Setup*.exe

      # Release assets: the raw exe (consumed by the in-place auto-updater) and
      # the installer (the website's download button). No plain Hotfix.exe.
      - name: Prepare raw exe release asset
        if: github.event_name == 'release'
        run: Copy-Item dist/Hotfix.exe "dist/Hotfix-${{ github.event.release.tag_name }}-Windows.exe"

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Hotfix-${{ github.event.release.tag_name }}-Windows.exe
            dist/Hotfix-Setup-${{ github.event.release.tag_name }}-Windows.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install librsvg (for icon generation)
        run: brew install librsvg

      - name: Test
        run: swift test

      - name: Build DMG
        run: bash scripts/build.sh

      - name: Upload artifact (all runs)
        uses: actions/upload-artifact@v7
        with:
          name: Hotfix-macOS
          path: dist/Hotfix.dmg

      - name: Prepare versioned release asset
        if: github.event_name == 'release'
        run: cp dist/Hotfix.dmg "dist/Hotfix-${{ github.event.release.tag_name }}-macOS.dmg"

      # Release asset: versioned DMG only (the mac updater matches by .dmg suffix).
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Hotfix-${{ github.event.release.tag_name }}-macOS.dmg

  # One job per CPU, each on a native runner. Ubuntu 22.04 (glibc 2.35) so the
  # app runs on 22.04 and newer, Debian 12, Fedora, etc.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
            runner: ubuntu-22.04
            nfpm_sha256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
          - arch: arm64
            goarch: arm64
            runner: ubuntu-22.04-arm
            nfpm_sha256: a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4
    runs-on: ${{ matrix.runner }}
    env:
      # The settings window's webview library, built from pinned source (the
      # tarball's checksum is verified) rather than taken prebuilt from anyone.
      WEBVIEW_VERSION: 0.12.0
      WEBVIEW_SHA256: e2c8d0bed3fcd13e624074448b7d3b1d0b0d03546a15839f17ee0013f2cba1db

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb desktop-file-utils rpm

      # libwebview.so renders the settings window (the same page as the Windows
      # app) with WebKitGTK 4.1. It goes into linux/webviewlib/, where `go build`
      # embeds it (linux/webviewlib.go); the app loads it at runtime via purego,
      # so the Go build itself stays CGO-free.
      - name: Build webview library
        run: |
          curl -fsSL -o "$RUNNER_TEMP/webview.tar.gz" \
            "https://github.com/webview/webview/archive/refs/tags/${WEBVIEW_VERSION}.tar.gz"
          echo "${WEBVIEW_SHA256}  $RUNNER_TEMP/webview.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/webview.tar.gz" -C "$RUNNER_TEMP"
          src="$RUNNER_TEMP/webview-${WEBVIEW_VERSION}"
          g++ -std=c++11 -O2 -fPIC -shared -DWEBVIEW_BUILD_SHARED \
            -I"$src/core/include" "$src/core/src/webview.cc" \
            $(pkg-config --cflags --libs gtk+-3.0 webkit2gtk-4.1) \
            -Wl,-soname,libwebview.so -Wl,--as-needed \
            -o linux/webviewlib/libwebview.so
          objdump -p linux/webviewlib/libwebview.so | grep -E 'SONAME|NEEDED'
          nm -D --defined-only linux/webviewlib/libwebview.so | grep -E ' webview_(create|bind|return)$'

      - name: Vet and test
        run: |
          cd linux
          go vet ./...
          go test ./...

      # The licensing backend (worker/src/license.js) the Linux app talks to.
      - name: Test licensing API
        if: matrix.arch == 'x86_64'
        run: node --test worker/test/license.test.mjs

      # CGO_ENABLED=0: no C toolchain in the Go build; purego dynamically links
      # only the system C library and loads WebKitGTK when the window opens.
      #
      # The subscription check is compiled in by stamping the license public key
      # (repo variable LICENSE_PUBLIC_KEY — see worker/README.md) into the
      # binary. A release must never ship without it — that would be a build
      # that doesn't enforce licensing — so the job fails instead.
      - name: Build
        env:
          CGO_ENABLED: 0
          LICENSE_PUBLIC_KEY: ${{ vars.LICENSE_PUBLIC_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$LICENSE_PUBLIC_KEY" ] && [ "$EVENT_NAME" = "release" ]; then
            echo "::error::Repo variable LICENSE_PUBLIC_KEY is not set; refusing to release a Linux build without license enforcement."
            exit 1
          fi
          mkdir -p "dist/linux-${{ matrix.arch }}"
          cd linux
          GOARCH="${{ matrix.goarch }}" go build -trimpath \
            -ldflags "-s -w -X main.licensePublicKey=${LICENSE_PUBLIC_KEY}" \
            -o "../dist/linux-${{ matrix.arch }}/hotfix" .
          version="$(../dist/linux-${{ matrix.arch }}/hotfix --version)"
          echo "$version"
          if [ -n "$LICENSE_PUBLIC_KEY" ] && echo "$version" | grep -q "dev build"; then
            echo "::error::License public key was not compiled into the binary."
            exit 1
          fi

      # Opens the real settings window under a virtual display, drives the page
      # through its bindings (load, save, a rejected save, log), and checks
      # what it shows and what got saved. See runSettingsWindow in
      # linux/settings_window.go.
      - name: Test settings window
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)" XDG_STATE_HOME="$(mktemp -d)" XDG_RUNTIME_DIR="$(mktemp -d)"
          xvfb-run -a "dist/linux-${{ matrix.arch }}/hotfix" --settings-selftest

      # The raw binary (consumed by the in-place auto-updater), a .deb and .rpm
      # (double-click installers, the Linux counterpart of Setup.exe — see
      # linux/packaging/nfpm.yaml), and a .tar.gz with install.sh (per-user
      # install for any other distro).
      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
          # Prebuilt nfpm, pinned by version and checksum (from the release's
          # checksums.txt). Not `go install`: that needs a newer Go than the
          # 1.22 this job builds the app with.
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          # Non-release builds get the run number (1.0.12-dev.42 → 1.0.12~dev.42),
          # so each test build installs as an upgrade over the previous one.
          if [ -n "$TAG" ]; then
            pkgver="${TAG#v}"
          else
            pkgver="$(sed -n 's/^[[:space:]]*currentVersion *= *"\(.*\)"/\1/p' linux/updater.go)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "package version: $pkgver"
          curl -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${{ matrix.arch }}.tar.gz"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP" nfpm
          nfpm="$RUNNER_TEMP/nfpm"
          "$nfpm" --version | grep -i gitversion

          arch="${{ matrix.arch }}"
          name="Hotfix-${TAG:-dev}-Linux-${arch}"

          install -D -m 755 "dist/linux-${arch}/hotfix" dist/nfpm/hotfix
          for fmt in deb rpm; do
            ARCH="${{ matrix.goarch }}" VERSION="$pkgver" \
              "$nfpm" package -f linux/packaging/nfpm.yaml -p "$fmt" -t "dist/${name}.${fmt}"
          done
          rm -rf dist/nfpm

          mkdir -p "dist/${name}"
          cp "dist/linux-${arch}/hotfix" "dist/${name}/hotfix"
          cp linux/packaging/install.sh linux/packaging/uninstall.sh "dist/${name}/"
          cp icon/AppIcon.svg "dist/${name}/hotfix.svg"
          chmod 755 "dist/${name}/hotfix" "dist/${name}/install.sh" "dist/${name}/uninstall.sh"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"
          cp "dist/linux-${arch}/hotfix" "dist/${name}"
          ls -la dist/

      # Install the .deb on the runner the way a user would, check what landed
      # where, then remove it again. Also sanity-check the .rpm metadata.
      - name: Test packages
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="Hotfix-${TAG:-dev}-Linux-${{ matrix.arch }}"
          desktop-file-validate linux/packaging/hotfix.desktop

          dpkg-deb --info "dist/${name}.deb"
          sudo apt-get install -y "./dist/${name}.deb"
          dpkg -L hotfix
          test "$(command -v hotfix)" = /usr/bin/hotfix
          hotfix --version
          test -f /usr/share/applications/hotfix.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/hotfix.svg
          sudo apt-get remove -y hotfix
          test ! -e /usr/bin/hotfix

          rpm -qip "dist/${name}.rpm"
          rpm -qRp "dist/${name}.rpm" | grep -q 'libwebkit2gtk-4.1.so.0'
          rpm -qlp "dist/${name}.rpm" | grep -qx /usr/bin/hotfix

      - name: Upload artifact (all runs)
        uses: actions/upload-artifact@v7
        with:
          name: Hotfix-Linux-${{ matrix.arch }}
          path: dist/Hotfix-*-Linux-*

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Hotfix-${{ github.event.release.tag_name }}-Linux-${{ matrix.arch }}
            dist/Hotfix-${{ github.event.release.tag_name }}-Linux-${{ matrix.arch }}.deb
            dist/Hotfix-${{ github.event.release.tag_name }}-Linux-${{ matrix.arch }}.rpm
            dist/Hotfix-${{ github.event.release.tag_name }}-Linux-${{ matrix.arch }}.tar.gz

  # On every release, rewrite the site's download buttons to the new
  # version+OS-named assets and push the change back to main (GitHub Pages
  # serves docs/ from main). Keeps docs/index.html links from going stale.
  update-site:
    needs: [build-windows, build-macos]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Bump download links to ${{ github.event.release.tag_name }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i -E \
            -e "s#Hotfix-v[0-9]+\.[0-9]+\.[0-9]+-macOS\.dmg#Hotfix-${TAG}-macOS.dmg#g" \
            -e "s#Hotfix-Setup-v[0-9]+\.[0-9]+\.[0-9]+-Windows\.exe#Hotfix-Setup-${TAG}-Windows.exe#g" \
            docs/index.html

      - name: Commit and push if changed
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Download links already point to ${TAG}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "site: bump download links to ${TAG} [skip ci]"
          git push origin main
