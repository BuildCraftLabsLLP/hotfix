name: Server

# Hotfix Server (server/, hotfixd). Separate from the desktop Build workflow:
# it ships on its own server-v* releases, which build.yml skips.

on:
  push:
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit + live tests natively on every OS/CPU, then a real end-to-end run:
  # install the service, start a CPU hog, switch to enforce, and check hotfixd
  # kills it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet and test
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt needed"; exit 1; }
          go vet ./...
          go test -count=1 -v ./...

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -X main.version=0.0.0-ci.${{ github.run_number }}" -o hotfixd$([ "$RUNNER_OS" = Windows ] && echo .exe) .

      - name: Service end-to-end (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -x
          sudo install -m 0755 hotfixd /usr/local/bin/hotfixd
          hotfixd version
          sudo hotfixd install
          if [ "$RUNNER_OS" = Linux ]; then systemctl is-active hotfixd; systemctl cat hotfixd | head -20
          else sudo launchctl print system/town.buildcraft.hotfixd | head -15; fi

          # Fresh installs only watch.
          hotfixd config show | grep '"mode": "monitor"'
          sudo hotfixd config set cpu_threshold 50
          sudo hotfixd config set kill_duration 5
          sudo hotfixd config set term_grace_seconds 2

          # A CPU hog owned by the runner user. Double-forked so it's reaped by
          # init once killed (a zombie would still answer kill -0).
          ( yes > /dev/null & echo $! > /tmp/hog.pid )
          HOG=$(cat /tmp/hog.pid)

          # Monitor mode: it must survive and be reported.
          sleep 20
          kill -0 "$HOG"
          sudo hotfixd status | tee /tmp/status.txt
          grep -q would_kill /tmp/status.txt

          # Enforce: it must die.
          sudo hotfixd config set mode enforce
          for i in $(seq 1 40); do kill -0 "$HOG" 2>/dev/null || break; sleep 1; done
          if kill -0 "$HOG" 2>/dev/null; then
            kill "$HOG"
            echo "::error::hotfixd did not kill the CPU hog"
            if [ "$RUNNER_OS" = Linux ]; then sudo journalctl -u hotfixd --no-pager | tail -60; fi
            sudo cat "/var/log/hotfix-server/hotfixd.log" "/Library/Logs/Hotfix Server/hotfixd.log" 2>/dev/null | tail -60
            exit 1
          fi
          hotfixd status | tee /tmp/status.txt   # readable without root
          grep -q killed /tmp/status.txt

          sudo hotfixd uninstall
          if [ "$RUNNER_OS" = Linux ]; then ! systemctl is-active hotfixd; fi
          hotfixd status | grep -i "not installed"

      - name: Service end-to-end (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "C:\Program Files\Hotfix Server"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item hotfixd.exe $dir
          $h = "$dir\hotfixd.exe"
          & $h version
          & $h install; if ($LASTEXITCODE) { exit 1 }
          sc.exe query hotfixd
          & $h config show | Select-String '"mode": "monitor"' | Out-Null
          & $h config set cpu_threshold 50
          & $h config set kill_duration 5

          $hog = Start-Process pwsh -ArgumentList '-NoProfile','-Command','while($true){}' -PassThru -WindowStyle Hidden
          Start-Sleep 20
          if ($hog.HasExited) { throw "the hog was killed in monitor mode" }
          & $h status | Tee-Object -Variable st
          if (-not ($st -match 'would_kill')) { throw "no would_kill reported" }

          & $h config set mode enforce
          for ($i = 0; $i -lt 40 -and -not $hog.HasExited; $i++) { Start-Sleep 1 }
          if (-not $hog.HasExited) {
            Stop-Process $hog -Force
            Get-Content "C:\ProgramData\Hotfix Server\logs\hotfixd.log" -Tail 60
            throw "hotfixd did not kill the CPU hog"
          }
          & $h status | Tee-Object -Variable st
          if (-not ($st -match 'killed')) { throw "no kill reported" }
          Get-WinEvent -LogName Application -MaxEvents 20 | Where-Object ProviderName -eq hotfixd | Format-Table TimeCreated, Message -AutoSize

          & $h uninstall; if ($LASTEXITCODE) { exit 1 }
          sc.exe query hotfixd; if ($LASTEXITCODE -eq 0) { throw "service still registered" }

  # Every release target builds (CGO-free cross-compiles from Linux).
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Cross-compile
        env:
          CGO_ENABLED: 0
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=$([ "$os" = windows ] && echo .exe || true)
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=0.0.0-ci.${{ github.run_number }}" \
              -o "../dist/server/hotfixd-$os-$arch$ext" .
          done
          ls -la ../dist/server
      - uses: actions/upload-artifact@v4
        with:
          name: hotfixd-binaries
          path: dist/server/
