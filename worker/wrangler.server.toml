# Hotfix Server licensing API (src/server-api.js): hotfix.buildcraft.town/api/server/*
#
# A separate Worker from the /dl download counter (wrangler.toml), so this
# one's bindings and secrets can never block a download-link deploy.
# Deploy with:   wrangler deploy -c wrangler.server.toml
# Setup steps: worker/README.md, "Hotfix Server licensing".

name = "hotfix-server-api"
main = "src/server-api.js"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "hotfix.buildcraft.town/api/server/*", zone_name = "buildcraft.town" },
]

# Licenses, subscriptions and seats. Create once, then apply the schema:
#   wrangler d1 create hotfix-server
#   wrangler d1 migrations apply hotfix-server --remote -c wrangler.server.toml
[[d1_databases]]
binding = "HOTFIX_SERVER_DB"
database_name = "hotfix-server"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# Trials and rate limits. Create once:
#   wrangler kv namespace create HOTFIX_SERVER_KV
[[kv_namespaces]]
binding = "HOTFIX_SERVER_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
RAZORPAY_KEY_ID = "REPLACE_WITH_RAZORPAY_KEY_ID"                # rzp_live_… (rzp_test_… while testing)
RAZORPAY_SERVER_PLAN_ID = "REPLACE_WITH_RAZORPAY_PLAN_ID"       # the $1/server/month Plan
# TRIAL_DAYS = "14"
# TRIAL_IP_DAILY = "25"

# Secrets (wrangler secret put <NAME> -c wrangler.server.toml):
#   RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, SERVER_LICENSE_SIGNING_KEY
#   GITHUB_TOKEN (optional: the latest-version lookup)
